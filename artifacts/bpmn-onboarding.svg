<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="rgba(234,242,252,0.6)"/>
    </marker>
  </defs>
  <defs>
    <pattern id="dg" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="rgba(159,179,201,0.16)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0d2b4c"/>
  <rect width="1600" height="1000" fill="url(#dg)"/>
  <!-- pool frame -->
  <rect x="70" y="70" width="1460" height="860" fill="none" stroke="rgba(234,242,252,0.35)" stroke-width="3"/>
  <line x1="70" y1="500" x2="1530" y2="500" stroke="rgba(234,242,252,0.35)" stroke-width="2"/>
  <line x1="170" y1="70" x2="170" y2="930" stroke="rgba(234,242,252,0.35)" stroke-width="2"/>
  <!-- lane labels (rotated bars) -->
  <rect x="96" y="250" width="14" height="120" rx="7" fill="rgba(234,242,252,0.3)"/>
  <rect x="96" y="680" width="14" height="120" rx="7" fill="rgba(234,242,252,0.3)"/>
  <!-- start event -->
  <circle cx="260" cy="290" r="42" fill="none" stroke="rgba(34,211,238,0.7)" stroke-width="3.5"/>
  <circle cx="260" cy="290" r="12" fill="rgba(34,211,238,0.55)"/>
  <!-- tasks lane 1 -->
  <g fill="#123458" stroke="rgba(34,211,238,0.6)" stroke-width="2.4">
    <rect x="380" y="245" width="210" height="92" rx="14"/>
    <rect x="700" y="245" width="210" height="92" rx="14"/>
    <rect x="1020" y="245" width="210" height="92" rx="14"/>
  </g>
  <!-- task icons + text bars -->
  <g fill="rgba(234,242,252,0.28)">
    <rect x="410" y="278" width="120" height="12" rx="6"/>
    <rect x="730" y="278" width="120" height="12" rx="6"/>
    <rect x="1050" y="278" width="120" height="12" rx="6"/>
  </g>
  <g fill="none" stroke="rgba(234,242,252,0.45)" stroke-width="2">
    <rect x="404" y="264" width="22" height="22" rx="4"/>
    <rect x="724" y="264" width="22" height="22" rx="4"/>
    <rect x="1044" y="264" width="22" height="22" rx="4"/>
  </g>
  <!-- gateway -->
  <polygon points="700,600 770,668 700,736 630,668" fill="rgba(255,87,34,0.1)" stroke="rgba(255,87,34,0.75)" stroke-width="3"/>
  <path d="M682 650l36 36m0-36l-36 36" stroke="rgba(255,87,34,0.8)" stroke-width="3.5"/>
  <!-- tasks lane 2 -->
  <g fill="#123458" stroke="rgba(34,211,238,0.6)" stroke-width="2.4">
    <rect x="900" y="622" width="210" height="92" rx="14"/>
    <rect x="1220" y="622" width="210" height="92" rx="14"/>
  </g>
  <g fill="rgba(234,242,252,0.28)">
    <rect x="930" y="655" width="120" height="12" rx="6"/>
    <rect x="1250" y="655" width="120" height="12" rx="6"/>
  </g>
  <g fill="none" stroke="rgba(234,242,252,0.45)" stroke-width="2">
    <rect x="924" y="641" width="22" height="22" rx="4"/>
    <rect x="1244" y="641" width="22" height="22" rx="4"/>
  </g>
  <!-- end events -->
  <circle cx="1440" cy="668" r="40" fill="none" stroke="rgba(255,87,34,0.8)" stroke-width="5"/>
  <circle cx="520" cy="850" r="36" fill="none" stroke="rgba(159,179,201,0.5)" stroke-width="3.5"/>
  <rect x="504" y="834" width="32" height="32" rx="6" fill="rgba(159,179,201,0.35)"/>
  <!-- flows -->
  <g stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none">
    <path d="M302 290h78" marker-end="url(#fa)"/>
    <path d="M590 291h110" marker-end="url(#fa)"/>
    <path d="M910 291h110" marker-end="url(#fa)"/>
  </g>
  <path d="M1230 337v285" stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none" marker-end="url(#fa)"/>
  <path d="M900 668h-130" stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none" marker-end="url(#fa)"/>
  <path d="M630 668h-74" stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none" marker-end="url(#fa)"/>
  <path d="M556 704v110" stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none" marker-end="url(#fa)"/>
  <path d="M1110 668h290" stroke="rgba(234,242,252,0.55)" stroke-width="2.6" fill="none" marker-end="url(#fa)"/>
  <!-- boundary timer on task -->
  <g>
    <circle cx="1010" cy="245" r="26" fill="#0d2b4c" stroke="rgba(255,87,34,0.7)" stroke-width="2.5"/>
    <path d="M1010 231v14l10 6" stroke="rgba(255,87,34,0.7)" stroke-width="2.5" fill="none"/>
  </g>
</svg>

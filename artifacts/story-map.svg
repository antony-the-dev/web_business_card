<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="dg" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="rgba(159,179,201,0.16)"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0d2b4c"/>
  <rect width="1600" height="1000" fill="url(#dg)"/>
  <!-- release band (top slice) -->
  <rect x="120" y="70" width="1360" height="150" rx="12" fill="rgba(255,87,34,0.07)" stroke="rgba(255,87,34,0.45)" stroke-width="1.6" stroke-dasharray="8 7"/>
  <!-- column headers -->
  <g fill="#123458" stroke="rgba(34,211,238,0.55)" stroke-width="2">
    <rect x="140" y="250" width="290" height="64" rx="10"/>
    <rect x="490" y="250" width="290" height="64" rx="10"/>
    <rect x="840" y="250" width="290" height="64" rx="10"/>
    <rect x="1190" y="250" width="270" height="64" rx="10"/>
  </g>
  <g fill="rgba(234,242,252,0.32)">
    <rect x="170" y="274" width="180" height="13" rx="6.5"/>
    <rect x="520" y="274" width="180" height="13" rx="6.5"/>
    <rect x="870" y="274" width="180" height="13" rx="6.5"/>
    <rect x="1215" y="274" width="170" height="13" rx="6.5"/>
  </g>
  <!-- backbone row of cards -->
  <g fill="#102f52" stroke="rgba(159,179,201,0.45)" stroke-width="1.8">
    <rect x="150" y="360" width="270" height="110" rx="10"/>
    <rect x="500" y="360" width="270" height="110" rx="10"/>
    <rect x="850" y="360" width="270" height="110" rx="10"/>
    <rect x="1195" y="360" width="260" height="110" rx="10"/>
  </g>
  <g fill="rgba(234,242,252,0.22)">
    <rect x="176" y="392" width="190" height="11" rx="5.5"/>
    <rect x="176" y="420" width="140" height="9" rx="4.5"/>
    <rect x="526" y="392" width="190" height="11" rx="5.5"/>
    <rect x="526" y="420" width="140" height="9" rx="4.5"/>
    <rect x="876" y="392" width="190" height="11" rx="5.5"/>
    <rect x="876" y="420" width="140" height="9" rx="4.5"/>
    <rect x="1218" y="392" width="185" height="11" rx="5.5"/>
    <rect x="1218" y="420" width="130" height="9" rx="4.5"/>
  </g>
  <!-- story rows: three descending swimlanes -->
  <g stroke="rgba(159,179,201,0.22)" stroke-width="1.4">
    <line x1="120" y1="520" x2="1480" y2="520"/>
    <line x1="120" y1="700" x2="1480" y2="700"/>
  </g>
  <!-- stickies row 1 -->
  <g transform="rotate(-1.6)">
    <rect x="165" y="545" width="240" height="96" rx="8" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.45)" stroke-width="1.8"/>
    <rect x="515" y="548" width="240" height="96" rx="8" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.4)" stroke-width="1.8"/>
    <rect x="865" y="544" width="240" height="96" rx="8" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.45)" stroke-width="1.8"/>
  </g>
  <g fill="rgba(234,242,252,0.2)">
    <rect x="192" y="572" width="160" height="10" rx="5"/>
    <rect x="192" y="598" width="120" height="9" rx="4.5"/>
    <rect x="542" y="575" width="160" height="10" rx="5"/>
    <rect x="892" y="571" width="160" height="10" rx="5"/>
  </g>
  <!-- stickies row 2 -->
  <g transform="rotate(1.2)">
    <rect x="175" y="730" width="230" height="92" rx="8" fill="rgba(159,179,201,0.08)" stroke="rgba(159,179,201,0.35)" stroke-width="1.8"/>
    <rect x="880" y="733" width="225" height="92" rx="8" fill="rgba(159,179,201,0.06)" stroke="rgba(159,179,201,0.3)" stroke-width="1.8"/>
    <rect x="1230" y="729" width="220" height="92" rx="8" fill="rgba(255,87,34,0.07)" stroke="rgba(255,87,34,0.4)" stroke-width="1.8"/>
  </g>
  <g fill="rgba(234,242,252,0.18)">
    <rect x="202" y="758" width="155" height="10" rx="5"/>
    <rect x="905" y="761" width="150" height="10" rx="5"/>
    <rect x="1256" y="757" width="145" height="10" rx="5"/>
  </g>
  <!-- goal marker -->
  <polygon points="1320,105 1352,124 1352,162 1320,181 1288,162 1288,124" fill="none" stroke="rgba(255,87,34,0.7)" stroke-width="3"/>
  <g fill="rgba(234,242,252,0.25)">
    <rect x="180" y="120" width="260" height="14" rx="7"/>
    <rect x="180" y="152" width="180" height="10" rx="5"/>
  </g>
</svg>
